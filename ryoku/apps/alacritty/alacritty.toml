# Your alacritty config. Ryoku seeds this once and never overwrites it, so
# anything you add here survives updates. Keys here win over the imports.

[general]
# theme palette, written by matugen next to this file
import = ["colors.toml"]

[window]
# the same breathing room as kitty's window_margin_width
padding = { x = 8, y = 8 }
