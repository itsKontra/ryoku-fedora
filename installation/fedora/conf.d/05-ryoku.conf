# Anaconda configuration drop-in for Ryoku Fedora Desktop.
#
# 1. Enforces that user accounts must have a non-empty password
#    by omitting the 'empty' attribute from the user password policy.
#    In the Anaconda GTK UI, this disables the "allow empty password" checkbox
#    and prevents exiting the user creation spoke with an empty password.
# 2. Hides the standalone root password spoke to enforce the Ryoku security model
#    where users configure a personal administrator account with wheel/sudo privileges.

[User Interface]
hidden_spokes =
    PasswordSpoke

password_policies =
    root (quality 1, length 6)
    user (quality 1, length 6)
    luks (quality 1, length 6)
