# Anaconda drop-in for the Ryoku Fedora ISO, loaded from the updates image
# build.sh adds. The root password page is hidden, so the first account is an
# administrator with a password (post/check-admin enforces it). Automatic
# partitioning gives Btrfs with /.snapshots as its own top-level subvolume, the
# layout ryoku doctor and the snapshot boot menu expect.

[User Interface]
hidden_spokes =
    PasswordSpoke

password_policies =
    root (quality 1, length 6)
    user (quality 1, length 6)
    luks (quality 1, length 6)

[Storage]
default_scheme = BTRFS
default_partitioning =
    /           (min 1 GiB, max 70 GiB)
    /home       (min 500 MiB, free 50 GiB)
    /.snapshots (btrfs)
