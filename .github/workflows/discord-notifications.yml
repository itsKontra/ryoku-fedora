name: Discord Notifications

# Posts new issues and new, ready or merged pull requests to the Ryoku Discord's
# GitHub feed (#repo) through bin/ryoku-discord. Issue events run the default
# branch's copy of this file; pull_request_target runs the base branch's copy.

on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: read

jobs:
  notify:
    name: Send Discord notification
    # a closed pull request is only news when it was merged
    if: github.event_name == 'issues' || github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_FEED_WEBHOOK_URL }}

    steps:
      # The base branch's notifier only: a pull_request_target job must never
      # run code from the pull request, and the event JSON is all it reads.
      - name: Checkout the notifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            bin/ryoku-discord
            .github/PULL_REQUEST_TEMPLATE.md
          sparse-checkout-cone-mode: false

      - name: Post to the feed
        shell: bash
        run: |
          if [[ $GITHUB_EVENT_NAME == issues ]]; then
            bin/ryoku-discord issue
          else
            bin/ryoku-discord pull-request
          fi
