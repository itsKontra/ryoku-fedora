name: Delivery check

# Guards that what a dev box runs actually reaches an installed box: every
# ryoku/apps config is shipped by a package/installer/deploy path. See
# docs/updates.md.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify update delivery
        run: bin/ryoku-dev-verify-delivery
