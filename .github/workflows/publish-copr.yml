name: Publish Fedora COPR packages
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-fedora
  cancel-in-progress: false
jobs:
  gate:
    if: github.repository == 'itsKontra/ryoku-fedora' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    uses: ./.github/workflows/fedora-rpm.yml
    with:
      release: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-alpha.{0}', github.run_number) }}
      channel: ${{ github.ref_type == 'tag' && 'stable' || 'testing' }}
  copr:
    needs: gate
    runs-on: ubuntu-latest
    environment: fedora-publish
    container: fedora:44
    steps:
      - run: dnf -y install git python3-copr gnupg2 rpm rpm-sign createrepo_c curl
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check trusted source and deployment configuration
        env:
          RYOKU_RPM_BASE_URL: ${{ vars.RYOKU_RPM_BASE_URL }}
          COPR_FINGERPRINT: ${{ vars.RYOKU_COPR_FINGERPRINT }}
          METADATA_FINGERPRINT: ${{ vars.RYOKU_RPM_SIGNING_KEY }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test -n "$COPR_FINGERPRINT"
          test -n "$METADATA_FINGERPRINT"
          case "$RYOKU_RPM_BASE_URL" in https://?*) ;; *) echo 'Set RYOKU_RPM_BASE_URL to the HTTPS Fedora release root'; exit 1 ;; esac
      - uses: actions/download-artifact@v4
        with:
          name: fedora-srpms
          path: /tmp/srpms
      - name: Submit SRPMs, wait, and download exact build results
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_CONFIG_FILE: /tmp/copr-config
        run: |
          umask 077
          trap 'rm -f "$COPR_CONFIG_FILE"' EXIT
          test -n "$COPR_CONFIG"
          printf '%s\n' "$COPR_CONFIG" > "$COPR_CONFIG_FILE"
          python3 release/rpm/copr-build.py /tmp/srpms /tmp/copr-rpms
      - name: Preserve RPM signatures and sign release metadata
        env:
          RYOKU_COPR_FINGERPRINT: ${{ vars.RYOKU_COPR_FINGERPRINT }}
          RYOKU_RPM_SIGNING_KEY: ${{ vars.RYOKU_RPM_SIGNING_KEY }}
          METADATA_PRIVATE_KEY: ${{ secrets.RYOKU_RPM_METADATA_PRIVATE_KEY }}
        run: |
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$METADATA_PRIVATE_KEY" | gpg --batch --import
          curl --fail --location --proto '=https' --proto-redir '=https' -o /tmp/copr.asc https://download.copr.fedorainfracloud.org/results/itskontra/ryoku/pubkey.gpg
          release/rpm/compose-repo.sh /tmp/copr-rpms /tmp/copr.asc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fedora-copr-candidate
          path: /tmp/copr-rpms
          if-no-files-found: error
  install:
    needs: copr
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compositor: [hyprland, niri]
        dnf: [dnf, dnf4]
    container: fedora:44
    steps:
      - run: dnf -y install git python3-dnf
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fedora-copr-candidate
          path: /tmp/fedora-rpms
      - name: Verify publisher signatures and install unchanged RPMs
        env:
          RYOKU_TEST_DNF: ${{ matrix.dnf }}
          RYOKU_TEST_PREBUILT: '1'
          RYOKU_TEST_SIGNED: '1'
          RYOKU_COPR_FINGERPRINT: ${{ vars.RYOKU_COPR_FINGERPRINT }}
          RYOKU_RPM_SIGNING_KEY: ${{ vars.RYOKU_RPM_SIGNING_KEY }}
        run: installation/tests/fedora-rpm.sh '${{ matrix.compositor }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copr-install-${{ matrix.compositor }}-${{ matrix.dnf }}
          path: /tmp/fedora-evidence
  promote:
    needs: install
    runs-on: ubuntu-latest
    environment: fedora-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fedora-copr-candidate
          path: candidate
      - name: Publish immutable release and atomically advance channel
        env:
          RYOKU_RPM_BASE_URL: ${{ vars.RYOKU_RPM_BASE_URL }}
          RYOKU_RPM_PUBLISH_HOST: ${{ vars.RYOKU_RPM_PUBLISH_HOST }}
          RYOKU_RPM_PUBLISH_ROOT: ${{ vars.RYOKU_RPM_PUBLISH_ROOT }}
          RYOKU_RPM_SSH_KEY: ${{ secrets.RYOKU_RPM_SSH_KEY }}
          RYOKU_RPM_KNOWN_HOSTS: ${{ secrets.RYOKU_RPM_KNOWN_HOSTS }}
        run: python3 release/rpm/publish.py candidate
