name: Stash installer

# stash-install (shell/scripts/stash-install.sh) turns a dropped file into a
# launcher entry: an .rpm goes through dnf install, a flatpak bundle through
# flatpak install, a .deb payload gets cracked open with bsdtar, and an Arch
# package is refused. tests stub pkexec/dnf/rpm/flatpak and check each
# dispatch, that a generic tarball is never escalated, and that a failed or
# cancelled rpm install keeps its source. see tests/stash-install.sh.

on:
  pull_request:
    paths:
      - 'ryoku/shell/scripts/stash-install.sh'
      - 'tests/stash-install.sh'
  push:
    branches:
      - main
    paths:
      - 'ryoku/shell/scripts/stash-install.sh'
      - 'tests/stash-install.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stash-install:
    name: Stash turns dropped files into launcher entries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bsdtar (libarchive) for the .deb payload cases
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Stash installer dispatch
        shell: bash
        run: bash tests/stash-install.sh
