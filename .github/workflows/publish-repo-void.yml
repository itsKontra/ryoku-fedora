name: "Publish Ryoku XBPS repo"

on:
  push:
    branches:
      - unstable-dev
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Overwrite an existing void/releases/<tag> repository'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  checks: read

env:
  RYOKU_XBPS_WORK: ${{ github.workspace }}/.cache/void-xbps
concurrency:
  group: publish-repo-void-${{ github.ref_type == 'tag' && 'stable' || 'testing' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and sign the XBPS repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      release: ${{ steps.channel.outputs.release }}
      prefix: ${{ steps.channel.outputs.prefix }}
    steps:
      - name: Verify required secrets are present
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VOID_REPO_SIGNING_KEY: ${{ secrets.VOID_REPO_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z $R2_ACCESS_KEY_ID ]] && missing+=(R2_ACCESS_KEY_ID)
          [[ -z $R2_SECRET_ACCESS_KEY ]] && missing+=(R2_SECRET_ACCESS_KEY)
          [[ -z $R2_ENDPOINT ]] && missing+=(R2_ENDPOINT)
          [[ -z $R2_BUCKET ]] && missing+=(R2_BUCKET)
          [[ -z $VOID_REPO_SIGNING_KEY ]] && missing+=(VOID_REPO_SIGNING_KEY)
          if ((${#missing[@]})); then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag=${GITHUB_REF#refs/tags/}
              echo "channel=stable" >> "$GITHUB_OUTPUT"
              echo "release=$tag" >> "$GITHUB_OUTPUT"
              echo "prefix=void/releases/$tag" >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/unstable-dev)
              release=$(./bin/ryoku-release-version --channel unstable-dev --build-number "$GITHUB_RUN_NUMBER" --sha "$GITHUB_SHA")
              echo "channel=testing" >> "$GITHUB_OUTPUT"
              echo "release=$release" >> "$GITHUB_OUTPUT"
              echo "prefix=void/channels/testing" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::publish-repo-void runs on a v* tag (stable) or unstable-dev (testing); got $GITHUB_REF"
              exit 1
              ;;
          esac
          cat "$GITHUB_OUTPUT"

      - name: Install repository tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone jq

      - name: Configure bucket and mark channel building
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          RELEASE: ${{ steps.channel.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          ./bin/ryoku-r2-config
          channel_dir=void/channels/testing/x86_64
          [[ $CHANNEL == stable ]] && channel_dir=void/x86_64
          ./bin/ryoku-channel-status "Ryoku:$R2_BUCKET/$channel_dir" building "$GITHUB_SHA" \
            --channel "$CHANNEL" --release "$RELEASE" \
            --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Verify the production signing key
        id: signing
        env:
          VOID_REPO_SIGNING_KEY: ${{ secrets.VOID_REPO_SIGNING_KEY }}
          XBPS_PASSPHRASE: ${{ secrets.VOID_REPO_SIGNING_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ryoku-xbps.pem"
          derived="$RUNNER_TEMP/ryoku-xbps-derived"
          printf '%s\n' "$VOID_REPO_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          mkdir -p "$derived"
          void/packages/repo/new-signing-key "$key" "$derived"
          shopt -s nullglob
          plists=("$derived"/*.plist)
          ((${#plists[@]} == 1)) || {
            echo "::error::Could not derive one XBPS public key plist from VOID_REPO_SIGNING_KEY"
            exit 1
          }
          name=${plists[0]##*/}
          committed="void/packages/srcpkgs/ryoku-keyring/files/$name"
          [[ -f $committed ]] || {
            echo "::error::VOID_REPO_SIGNING_KEY has fingerprint ${name%.plist}, but $committed is not committed. Generate it with void/packages/repo/new-signing-key before publishing."
            exit 1
          }
          cmp -s "${plists[0]}" "$committed" || {
            echo "::error::Committed XBPS key plist $committed does not match VOID_REPO_SIGNING_KEY"
            exit 1
          }
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Snapshot the published package set
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          PREFIX: ${{ steps.channel.outputs.prefix }}
          FORCE: ${{ inputs.force_release }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ $CHANNEL == stable && ${FORCE:-false} != true ]]; then
            existing=$(rclone lsf "Ryoku:$R2_BUCKET/$PREFIX/x86_64/" 2>/dev/null || true)
            if [[ -n $existing ]]; then
              echo "::error::$PREFIX/x86_64 already exists; a release is published once. Re-run with force_release to overwrite."
              exit 1
            fi
          fi

          mirror="$RUNNER_TEMP/published-xbps"
          mkdir -p "$mirror"
          if [[ $CHANNEL == stable ]]; then
            rclone copy "Ryoku:$R2_BUCKET/void/x86_64/" "$mirror/" --include '*.xbps' || true
            rclone copy "Ryoku:$R2_BUCKET/void/channels/testing/x86_64/" "$mirror/" \
              --filter '- ryoku-desktop-*' \
              --filter '+ *.xbps' \
              --filter '- *' \
              --ignore-existing || true
          else
            rclone copy "Ryoku:$R2_BUCKET/void/channels/testing/x86_64/" "$mirror/" \
              --include '*.xbps' || true
          fi
          echo "RYOKU_XBPS_MIRROR=$mirror" >> "$GITHUB_ENV"

      - name: Restore Void compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RYOKU_XBPS_WORK }}/hostdir/ccache
          key: void-ccache-${{ github.sha }}
          restore-keys: |
            void-ccache-

      - name: Restore Void source cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RYOKU_XBPS_WORK }}/hostdir/sources
          key: void-sources-${{ hashFiles('void/packages/srcpkgs/**') }}
          restore-keys: |
            void-sources-

      - name: Free build storage
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /opt/ghc \
            /usr/local/lib/android /usr/local/share/boost
          docker system prune -af
          df -h /

      - name: Build in the official Void container
        env:
          RYOKU_XBPS_KEY: ${{ steps.signing.outputs.key }}
          RYOKU_XBPS_PRODUCTION: '1'
          RYOKU_XBPS_OUT: ${{ github.workspace }}/void/packages/repo/out
          RYOKU_RELEASE: ${{ steps.channel.outputs.release }}
          RYOKU_CHANNEL: ${{ steps.channel.outputs.channel }}
          XBPS_PASSPHRASE: ${{ secrets.VOID_REPO_SIGNING_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RYOKU_XBPS_KEY"' EXIT
          void/packages/repo/container-runner.sh
      - name: Restore Void cache ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RYOKU_XBPS_WORK/hostdir/ccache" "$RYOKU_XBPS_WORK/hostdir/sources"
          sudo chown -R "$(id -u):$(id -g)" \
            "$RYOKU_XBPS_WORK/hostdir/ccache" "$RYOKU_XBPS_WORK/hostdir/sources"

      - name: Save Void compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RYOKU_XBPS_WORK }}/hostdir/ccache
          key: void-ccache-${{ github.sha }}

      - name: Save Void source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RYOKU_XBPS_WORK }}/hostdir/sources
          key: void-sources-${{ hashFiles('void/packages/srcpkgs/**') }}


      - name: Pack repository artifact
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/void-repo-artifact"
          mkdir -p "$stage/x86_64" "$stage/keys"
          cp -a void/packages/repo/out/x86_64/. "$stage/x86_64/"
          cp -a void/packages/srcpkgs/ryoku-keyring/files/*.plist "$stage/keys/"
          tar -C "$stage" -cf void/packages/repo/void-repo.tar .

      - name: Upload built repository
        uses: actions/upload-artifact@v4
        with:
          name: void-repo-${{ github.run_id }}
          path: void/packages/repo/void-repo.tar
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  gate:
    name: Required checks passed
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for required checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ./bin/ryoku-ci-gate "$GITHUB_SHA" --timeout-min 25

  container-install:
    name: Install the packaged niri desktop
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download built repository
        uses: actions/download-artifact@v4
        with:
          name: void-repo-${{ github.run_id }}
          path: void/packages/repo
      - name: Install and materialize in a clean Void container
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/void-repo-artifact"
          mkdir -p "$artifact"
          tar -C "$artifact" -xf void/packages/repo/void-repo.tar
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$artifact/x86_64:/repo:ro" \
            -v "$artifact/keys:/keys:ro" \
            -e RYOKU_PATH=/workspace \
            -e RYOKU_XBPS_REPO=/repo \
            -e RYOKU_XBPS_KEYRING_DIR=/keys \
            ghcr.io/void-linux/void-glibc \
            sh -c 'xbps-install -Syu xbps && xbps-install -Sy bash && exec bash /workspace/installation/tests/container-install-void.sh'

  publish:
    name: Publish signed XBPS repository
    needs: [build, gate, container-install]
    permissions:
      contents: read
      actions: write
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download tested repository
        uses: actions/download-artifact@v4
        with:
          name: void-repo-${{ github.run_id }}
          path: void/packages/repo
      - name: Install publish tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone jq libarchive-tools
      - name: Configure bucket
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: ./bin/ryoku-r2-config

      - name: Publish packages before repository metadata
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          PREFIX: ${{ needs.build.outputs.prefix }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/void-repo-artifact"
          mkdir -p "$artifact"
          tar -C "$artifact" -xf void/packages/repo/void-repo.tar
          src="$artifact/x86_64"
          shopt -s nullglob
          packages=("$src"/*.xbps)
          ((${#packages[@]})) || { echo '::error::No XBPS packages in artifact'; exit 1; }
          for package in "${packages[@]}"; do
            [[ -s $package.sig2 ]] || { echo "::error::Missing signature for ${package##*/}"; exit 1; }
          done
          [[ -s $src/x86_64-repodata ]] || { echo '::error::Missing x86_64-repodata'; exit 1; }

          publish() {
            local source=$1 destination=$2
            rclone copy "$source" "$destination" \
              --exclude 'x86_64-repodata' --exclude 'release.json' -P
            rclone copy "$source" "$destination" \
              --filter '+ x86_64-repodata' --filter '- *' -P
            rclone sync "$source" "$destination" --exclude 'release.json' --exclude 'status.json' -P
            rclone copyto "$source/release.json" "$destination/release.json" -P
          }
          publish "$src" "Ryoku:$R2_BUCKET/$PREFIX/x86_64/"
          echo "::notice::Published Void $CHANNEL to $PREFIX/x86_64 (packages and signatures first, repodata last)"
          if [[ $CHANNEL == stable ]]; then
            publish "$src" "Ryoku:$R2_BUCKET/void/x86_64/"
            echo "::notice::Stable Void pointer now serves $PREFIX"
          fi

      - name: Verify the published repository against the bucket
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          PREFIX: ${{ needs.build.outputs.prefix }}
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local remote=$1 tmp bad=0
            tmp=$(mktemp -d)
            rclone cat "$remote/x86_64-repodata" > "$tmp/repodata"
            bsdtar -xOf "$tmp/repodata" index.plist > "$tmp/index.plist"
            rclone lsf "$remote/" --files-only > "$tmp/files"
            python3 - "$tmp/index.plist" > "$tmp/packages" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as source:
              index = plistlib.load(source)

          def packages(value):
              if isinstance(value, dict):
                  pkgver = value.get("pkgver")
                  architecture = value.get("architecture")
                  if pkgver and architecture:
                      yield value.get("filename") or f"{pkgver}.{architecture}.xbps"
                  else:
                      for child in value.values():
                          yield from packages(child)
              elif isinstance(value, (list, tuple)):
                  for child in value:
                      yield from packages(child)

          for filename in sorted(set(packages(index))):
              print(filename)
          PY
            [[ -s $tmp/packages ]] || {
              echo "::error::$remote/x86_64-repodata lists no packages"
              return 1
            }
            while IFS= read -r package; do
              if ! grep -Fxq "$package" "$tmp/files"; then
                echo "::error::$remote: $package is listed in repodata but missing from the bucket"
                bad=1
              fi
              if ! grep -Fxq "$package.sig2" "$tmp/files"; then
                echo "::error::$remote: $package.sig2 is missing from the bucket"
                bad=1
              fi
            done < "$tmp/packages"
            return "$bad"
          }
          verify "Ryoku:$R2_BUCKET/$PREFIX/x86_64"
          if [[ $CHANNEL == stable ]]; then
            verify "Ryoku:$R2_BUCKET/void/x86_64"
          fi

      - name: Freeze the testing build and update its ledger
        if: needs.build.outputs.channel == 'testing'
        env:
          REMOTE: Ryoku:${{ secrets.R2_BUCKET }}
          RELEASE: ${{ needs.build.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/void-repo-artifact/x86_64"
          [[ -s $src/release.json ]] || { echo "::error::Tested repository has no release.json"; exit 1; }
          directory=${RELEASE//+/_}
          frozen="$REMOTE/void/channels/testing/builds/$directory/x86_64"

          # release.json is the completion marker consumed by the ledger.
          rclone sync "$src" "$frozen/" --exclude 'release.json' -P
          rclone copyto "$src/release.json" "$frozen/release.json" -P
          rclone check "$src" "$frozen/"

          ./bin/ryoku-release-ledger "$REMOTE" void testing \
            | jq -e --arg release "$RELEASE" '.latest == $release' >/dev/null \
            || { echo "::error::void/channels/testing/index.json does not list $RELEASE as latest"; exit 1; }
          echo "::notice::Frozen testing build $RELEASE and updated void/channels/testing/index.json"

      - name: Record the Void release in the ledger
        if: needs.build.outputs.channel == 'stable'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RELEASE: ${{ needs.build.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          ./bin/ryoku-release-ledger "Ryoku:$R2_BUCKET" void | jq -e --arg tag "$RELEASE" '.latest == $tag' >/dev/null \
            || { echo "::error::void/releases/index.json does not list $RELEASE as latest"; exit 1; }
          echo "::notice::void/releases/index.json now lists $RELEASE as latest"

      - name: Dispatch the Void release ISO build
        if: needs.build.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.build.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          stage=beta
          [[ $RELEASE == *-alpha* ]] && stage=alpha
          [[ $RELEASE != *-* ]] && stage=stable
          gh workflow run build-iso-void.yml -R "$GITHUB_REPOSITORY" --ref "$RELEASE" \
            -f release_stage="$stage" \
            -f repo_url="https://repo.ryoku.dev/stable/void/releases/$RELEASE/x86_64"
          echo "::notice::Dispatched build-iso-void.yml on $RELEASE"
      - name: Mark channel published
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          RELEASE: ${{ needs.build.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          channel_dir=void/channels/testing/x86_64
          [[ $CHANNEL == stable ]] && channel_dir=void/x86_64
          ./bin/ryoku-channel-status "Ryoku:$R2_BUCKET/$channel_dir" published "$GITHUB_SHA" \
            --channel "$CHANNEL" --release "$RELEASE" \
            --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  mark-failed:
    name: Mark failed Void channel build
    needs: [build, gate, container-install, publish]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install status tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone jq
      - name: Mark channel failed
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          ./bin/ryoku-r2-config
          case "$GITHUB_REF" in
            refs/tags/v*)
              channel=stable
              release=${GITHUB_REF#refs/tags/}
              channel_dir=void/x86_64
              ;;
            *)
              channel=testing
              release=$(./bin/ryoku-release-version --channel unstable-dev --build-number "$GITHUB_RUN_NUMBER" --sha "$GITHUB_SHA")
              channel_dir=void/channels/testing/x86_64
              ;;
          esac
          ./bin/ryoku-channel-status "Ryoku:$R2_BUCKET/$channel_dir" failed "$GITHUB_SHA" \
            --channel "$channel" --release "$release" \
            --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"


  # posts a failed push or release publish to the Discord CI channel; see the
  # notify-failure job in publish-repo.yml.
  notify-failure:
    name: Announce a failed Void publish
    needs: [build, gate, container-install, publish]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the notifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: bin/ryoku-discord
          sparse-checkout-cone-mode: false
      - name: Report the failure
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          channel=${CHANNEL:-unknown}
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "::error::The Void $channel publish failed at ${GITHUB_SHA:0:9}; boxes stay on the last good build until it is fixed and re-run. $run_url"
          bin/ryoku-discord publish-failed --edition Void --channel "$channel" \
            --ref "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --run "$run_url" \
            || echo "::warning::could not post the failure notice to Discord"

