name: Power and lock lifecycle

# Lid close, idle, suspend and the lock screen must stay safe while the desktop
# RPM replaces the processes that own them. These hermetic tests drive the real
# helpers against fake login1, systemd and session trees: the clamshell and idle
# policies, the package power cutover (including the desktop spec's %pre sleep
# guard), and the qylock generation staging and fd hygiene.

on:
  pull_request:
    paths:
      - 'system/hardware/power/**'
      - 'release/rpm/ryoku-desktop.spec'
      - 'ryoku/lockscreen/install-qylock'
      - 'ryoku/lockscreen/ryoku-qylock-*'
      - 'ryoku/lockscreen/qylock/quickshell-lockscreen/**'
      - 'ryoku/shell/deploy.sh'
      - 'ryoku/shell/systemd/user/ryoku-*.service'
      - 'tests/clamshell-policy.sh'
      - 'tests/idle-policy.sh'
      - 'tests/power-cutover.sh'
      - 'tests/qylock-staging.sh'
      - 'tests/qylock-lock-fd.sh'
      - '.github/workflows/power-lifecycle.yml'
  push:
    branches:
      - main
    paths:
      - 'system/hardware/power/**'
      - 'release/rpm/ryoku-desktop.spec'
      - 'ryoku/lockscreen/install-qylock'
      - 'ryoku/lockscreen/ryoku-qylock-*'
      - 'ryoku/lockscreen/qylock/quickshell-lockscreen/**'
      - 'ryoku/shell/deploy.sh'
      - 'ryoku/shell/systemd/user/ryoku-*.service'
      - 'tests/clamshell-policy.sh'
      - 'tests/idle-policy.sh'
      - 'tests/power-cutover.sh'
      - 'tests/qylock-staging.sh'
      - 'tests/qylock-lock-fd.sh'
      - '.github/workflows/power-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: Lid, idle, cutover and lock generations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clamshell lid policy (suspend on lid close; AC + external display stays awake)
        shell: bash
        run: bash tests/clamshell-policy.sh

      - name: Idle daemon owns timeouts only
        shell: bash
        run: bash tests/idle-policy.sh

      - name: Package power cutover order
        shell: bash
        run: bash tests/power-cutover.sh

      - name: Staged lockscreen and daemon activate as one generation
        shell: bash
        run: bash tests/qylock-staging.sh

      - name: Lock guard fds stay out of the client tree
        shell: bash
        run: bash tests/qylock-lock-fd.sh
