name: Build Fedora ISO

# a v* tag reaches this through publish-copr.yml once its RPMs are published
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      base_iso_url:
        description: 'URL of the Fedora Everything netinst / boot ISO'
        required: false
        default: 'https://download.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/iso/Fedora-Everything-netinst-x86_64-44-1.7.iso'
      release_tag:
        description: 'Target GitHub release tag to attach the ISO to (leave empty for current ref/tag)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-fedora-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Compose Fedora 44 Ryoku ISO"
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    steps:
      - name: Install build toolchain
        run: |
          dnf -y install \
            git \
            curl \
            lorax \
            pykickstart \
            xorriso \
            mtools \
            createrepo_c \
            python3 \
            jq \
            coreutils
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for signed Ryoku RPM publication
        timeout-minutes: 45
        run: |
          set -euo pipefail
          repo_url='https://download.copr.fedorainfracloud.org/results/itskontra/ryoku/fedora-44-x86_64/'
          expected="0.$(git rev-list --count HEAD)-"
          # a tag waits for its own rebuild, not the main build of the same commit
          if [[ $GITHUB_EVENT_NAME != workflow_dispatch ]]; then
            expected+="${{ github.run_number }}."
          fi
          mapfile -t packages < <(
            awk '/^Name:[[:space:]]+/ { print $2 }' release/rpm/*.spec | sort -u
          )

          while true; do
            missing=()
            for package in "${packages[@]}"; do
              version=$(
                dnf5 --refresh --disablerepo='*' \
                  --repofrompath="RyokuCOPR,$repo_url" \
                  repoquery --latest-limit=1 --qf '%{version}-%{release}' "$package" \
                  2>/dev/null || true
              )
              [[ "$version" == "$expected"* ]] || missing+=("$package")
            done

            if ((${#missing[@]} == 0)); then
              echo "Signed Ryoku RPMs for ${expected%[-.]} are"
              echo "available."
              break
            fi

            echo "Waiting for signed Ryoku RPMs at ${expected%[-.]}:"
            echo "${missing[*]}"
            sleep 60
          done

      - name: Determine ISO version and name
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            VERSION="snapshot-$(git rev-parse --short HEAD)"
          fi
          ISO_NAME="ryoku-fedora-44-${VERSION}-x86_64.iso"
          echo "ISO_NAME=$ISO_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $ISO_NAME..."

      - name: Cache base ISO
        uses: actions/cache@v4
        id: cache-iso
        with:
          path: /tmp/base-netinst.iso
          key: ${{ runner.os }}-fedora-iso-${{ github.event.inputs.base_iso_url || 'default' }}

      - name: Download base Fedora installation media
        if: steps.cache-iso.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE_URL="${{ github.event.inputs.base_iso_url || 'https://download.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/iso/Fedora-Everything-netinst-x86_64-44-1.7.iso' }}"
          echo "Fetching base ISO from $BASE_URL..."
          curl -L --fail --retry 3 --retry-delay 5 -o /tmp/base-netinst.iso "$BASE_URL"
          ls -lh /tmp/base-netinst.iso

      - name: Compose Ryoku Fedora ISO
        run: |
          set -euo pipefail
          mkdir -p out work/repo
          bash installation/fedora/build-iso.sh \
            --boot-iso /tmp/base-netinst.iso \
            --out-dir out \
            --work-dir work \
            --repo-dir work/repo \
            --skip-closure-verify \
            --verify-netinstall \
            --iso-name "$ISO_NAME" \
            --volid "Ryoku-44-x86_64"

      - name: Verify USB EFI boot configuration
        run: bash installation/fedora/verify-iso-efi.sh "out/$ISO_NAME"

      - name: Verify checksum and provenance
        run: |
          set -euo pipefail
          cd out
          sha256sum "$ISO_NAME" > "${ISO_NAME}.sha256"
          cat "${ISO_NAME}.sha256"
          ls -lh

      - name: Upload ISO build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryoku-fedora-iso
          path: |
            out/*.iso
            out/*.sha256
            out/*.json
          retention-days: 14

  release:
    name: "Attach ISO to GitHub Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built ISO artifacts
        uses: actions/download-artifact@v4
        with:
          name: ryoku-fedora-iso
          path: out

      - name: Upload ISO and checksums to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          echo "Target release tag: $TAG"
          ls -lh out/

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet. Creating release..."
            previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
            title="Ryoku $(tr -d '[:space:]' < CODENAME) ${TAG#v}"
            MEDIA_REF="$TAG" bin/ryoku-release-notes "$previous" "$TAG" --title "$title" > "$RUNNER_TEMP/notes.md"
            # a 0.x line or a release candidate is not yet a stable promise
            prerelease=()
            [[ $TAG == v0.* || $TAG == *-rc.* ]] && prerelease=(--prerelease)
            gh release create "$TAG" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
          fi

          echo "Attaching assets to release $TAG..."
          gh release upload "$TAG" out/*.iso out/*.sha256 --clobber
          echo "Successfully uploaded assets to release $TAG."
