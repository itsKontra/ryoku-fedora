name: i18n

# Keep the per-language catalogs current without anyone editing them. When a
# push to main changes a displayed string -- any .qml, a hub schema
# label/desc/group, a Go i18n.T() call in an installer or the CLI, or a t/tf
# call in the installer's shell -- this extracts the English source and
# translates ONLY the strings each language is missing. overrides/<lang>.json
# (human fixes) are preserved.
#
# The result never lands on main directly: it is force-pushed to one branch,
# i18n/regenerate, rebuilt from main each run, and reviewed through a single
# standing PR. Once main already carries every translation, that PR is closed.

on:
  push:
    branches:
      - main
    paths:
      - '**/*.qml'
      - 'ryoku/hub/quickshell/schema/*.js'
      - 'ryoku/i18n/**'
      - 'ryoku-shell-installer/**'
      - 'ryoku/cli/**/*.go'
      - 'ryoku/shell/ipc/*.go'
      - 'ryoku/hub/backend/*.go'
      - 'ryoku/apps/ryostore/backend/*.go'
      - '.github/workflows/i18n.yml'
  workflow_dispatch:
    inputs:
      force:
        description: "Re-translate every string (upgrade existing), not just missing ones"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: i18n
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  BRANCH: i18n/regenerate
  SUBJECT: '[ryoku] i18n: regenerate translations'

jobs:
  translate:
    name: Regenerate translations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract English + translate missing strings
        # Prefer the LLM engine (domain prompt + glossary: correct word senses,
        # length kept in check) when a key is configured; otherwise fall back to
        # the free, keyless Google endpoint so the job still works with no secret.
        env:
          RYOKU_I18N_PROVIDER: openai
          RYOKU_I18N_URL: https://openrouter.ai/api/v1/chat/completions
          RYOKU_I18N_MODEL: ${{ vars.RYOKU_I18N_MODEL || 'google/gemini-2.5-flash' }}
          RYOKU_I18N_KEY: ${{ secrets.RYOKU_I18N_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 ryoku/i18n/tools/sync.py extract
          flag=""
          [ "$FORCE" = "true" ] && flag="--force"
          if [ -n "$RYOKU_I18N_KEY" ]; then
            python3 ryoku/i18n/tools/sync.py sync --engine llm $flag
          else
            python3 ryoku/i18n/tools/sync.py sync $flag
          fi
          # advisory: surface translations that expand the UI (non-fatal), and
          # print what the pass cost so a model change is a decision with a
          # number attached.
          python3 ryoku/i18n/tools/sync.py check || true
          python3 ryoku/i18n/tools/sync.py cost || true

      - name: Open or refresh the translations PR
        run: |
          pr=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if git diff --quiet -- ryoku/i18n/catalog; then
            echo "Translations already current on main."
            if [[ -n $pr ]]; then
              gh pr close "$pr" --delete-branch --comment 'main already carries every translation.'
            fi
            exit 0
          fi
          git config user.name "ryoku-i18n"
          git config user.email "noreply@ryoku"
          git add ryoku/i18n/catalog
          git commit -m "$SUBJECT"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          if [[ -n $pr ]]; then
            echo "Refreshed #$pr."
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" --title "$SUBJECT" --body \
            "Machine translations for strings main added or reworded, regenerated by the i18n workflow. This branch is rebuilt from main on every push that changes a displayed string, so it always holds the full set of missing translations. Put a better wording in \`ryoku/i18n/catalog/overrides/<lang>.json\` on main rather than editing this branch."
