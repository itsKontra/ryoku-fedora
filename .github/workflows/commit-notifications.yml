name: Commit Notifications

# Posts batches of new unstable-dev commits to the Ryoku Discord's GitHub feed
# (#repo) through bin/ryoku-discord. main is left out: it only moves when a
# release fast-forwards it, and the release announcement covers that.
#
# Batching: Actions runs are stateless, so the last commit announced lives in a
# cheap git ref (refs/notify/commits/unstable-dev). A push counts the people's
# commits since that pointer (the release bot's version bumps do not count),
# posts once there are THRESHOLD of them, reports all of them in one message,
# then advances the pointer. The pointer sits in its own ref namespace, so
# moving it never re-triggers this workflow.

on:
  push:
    branches:
      - unstable-dev

permissions:
  contents: write # advance the refs/notify/commits/* pointer

concurrency:
  group: commit-notifications-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  notify:
    name: Notify Discord of commit batches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_FEED_WEBHOOK_URL }}
      THRESHOLD: "5"
      BRANCH: ${{ github.ref_name }}
      AFTER: ${{ github.sha }}
      EVENT_BEFORE: ${{ github.event.before }}

    steps:
      - name: Checkout (full history, no file contents)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Notify commit batch
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z ${DISCORD_WEBHOOK:-} ]]; then
            echo "::notice::DISCORD_FEED_WEBHOOK_URL not configured; skipping."
            exit 0
          fi

          state_ref="refs/notify/commits/${BRANCH}"
          bot="41898282+github-actions[bot]@users.noreply.github.com"

          advance_pointer() {
            git push origin "+${1}:${state_ref}" >/dev/null 2>&1 \
              || echo "::warning::Failed to advance ${state_ref} to ${1:0:7}"
          }

          git fetch origin "+${state_ref}:${state_ref}" >/dev/null 2>&1 || true
          last="$(git rev-parse -q --verify "${state_ref}" 2>/dev/null || true)"

          # No pointer yet: count from the commit this push started from.
          [[ -n $last ]] || last="${EVENT_BEFORE:-}"
          if [[ -z $last || $last =~ ^0+$ ]]; then
            echo "No usable baseline; establishing pointer at ${AFTER:0:7}."
            advance_pointer "$AFTER"
            exit 0
          fi

          # A rewritten history falls back to this push's own base, and failing
          # that starts over at HEAD.
          if ! git merge-base --is-ancestor "$last" "$AFTER" 2>/dev/null; then
            last="${EVENT_BEFORE:-}"
            if [[ -z $last || $last =~ ^0+$ ]] || ! git merge-base --is-ancestor "$last" "$AFTER" 2>/dev/null; then
              echo "History rewritten; re-baselining pointer at ${AFTER:0:7}."
              advance_pointer "$AFTER"
              exit 0
            fi
          fi

          count="$(git log --no-merges --format='%ae' "${last}..${AFTER}" | grep -cvxF "$bot" || true)"
          echo "Branch ${BRANCH}: ${count} unannounced commit(s) since ${last:0:7} (threshold ${THRESHOLD})."

          if ((count < THRESHOLD)); then
            # keep accumulating from the same baseline on the next push
            git rev-parse -q --verify "${state_ref}" >/dev/null 2>&1 || advance_pointer "$last"
            echo "Below threshold; not notifying."
            exit 0
          fi

          bin/ryoku-discord commits --from "$last" --to "$AFTER" --branch "$BRANCH"
          advance_pointer "$AFTER"
