# sddm.service drop-in (/usr/lib/systemd/system/sddm.service.d/). When the
# display manager gives up (its start limit is hit, so it lands in failed),
# ryoku-console-fallback.service puts a text login with a banner on tty1
# instead of a black screen. The console guard runs first and, after a boot
# whose login screen died, holds sddm back for this one boot.
[Unit]
Wants=ryoku-console-guard.service
After=ryoku-console-guard.service
ConditionPathExists=!/run/ryoku/console-boot
OnFailure=ryoku-console-fallback.service
